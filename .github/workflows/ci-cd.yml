name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
              
    - name: Check code formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    # TUnit upload artifacts automatically https://tunit.dev/docs/guides/html-report/#enabling-automatic-artifact-upload
    - name: Expose GitHub Actions Runtime
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
          core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);
      
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Extract version from tag
      id: get_version
      run: |
        # Remove 'v' prefix from tag (e.g., v1.2.3 -> 1.2.3)
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.get_version.outputs.version }}
      
    - name: Pack NuGet packages
      run: |
        dotnet pack src/Svrooij.EndpointMapper/Svrooij.EndpointMapper.csproj \
          --configuration Release \
          --no-build \
          --output ./packages \
          /p:PackageVersion=${{ steps.get_version.outputs.version }} \
          /p:Version=${{ steps.get_version.outputs.version }}
          
    - name: List generated packages
      run: ls -la ./packages/

    - name: 🔑 Nuget trusted publishing
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: svrooij      
      
    - name: Publish to NuGet
      run: |
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{steps.nuget_login.outputs.NUGET_API_KEY}} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        
    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v5
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
